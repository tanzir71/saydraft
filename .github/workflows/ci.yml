name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Model catalog and installation contracts
        run: python -m pytest tests/test_versioned_models.py tests/test_meeting_models.py tests/test_model_packages.py tests/test_verified_downloader.py tests/test_manual_checklist.py -q --basetemp="${{ runner.temp }}/saydraft-pytest-catalog"
      - name: Fetch pinned VAD fixture for native offline smoke
        shell: pwsh
        run: |
          $vadFixture = python -c "from saydraft.model_download import download_silero_vad_model; print((download_silero_vad_model(models_dir='build/test-models') / 'silero_vad.onnx').resolve())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAYDRAFT_TEST_SILERO_MODEL=$vadFixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Unit and offline tests
        run: python -m pytest tests -q -rs -o faulthandler_timeout=120 --durations=12 --basetemp=build/pytest
      - name: Retain owned-window native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-window-native-diagnostics
          if-no-files-found: ignore
          path: |
            build/pytest/**/own-controls/report.json
            build/pytest/**/own-app-context/report.json
            build/pytest/**/own-tracked-edit/report.json
            build/pytest/**/own-selection/report.json
            build/pytest/**/own-command/report.json
            build/pytest/**/own-command-copy/report.json
            build/pytest/**/own-selection-copy/report.json
      - name: Cleanup regression evaluation
        run: python -m saydraft.eval --min-pass-rate 100 --min-cases 556
      - name: Adversarial cleanup validation
        run: python -m saydraft.cleanup.llm.eval_validation --min-catch-rate 100 --min-cases 100

  update-metadata-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify default-off policy without an outbound request
        run: python -m tools.probe_updates
      - name: Explicit opt-in public update metadata smoke
        run: python -m tools.probe_updates --enabled

  readonly-browser-ask-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
      SAYDRAFT_ASK_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install controlled UI and pinned browser dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix site
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location site
          npx playwright install chromium --no-shell
          $browserInstallExit = $LASTEXITCODE
          Pop-Location
          exit $browserInstallExit
      - name: Explicitly prepare verified CPU editing model outside uploaded evidence
        shell: pwsh
        run: |
          $askNativeCache = Join-Path $env:RUNNER_TEMP 'saydraft-ask-native-models'
          $env:SAYDRAFT_ASK_NATIVE_MODELS = $askNativeCache
          python -c 'import os,sys,json; from pathlib import Path; assert sys.platform == "win32" and os.environ.get("GITHUB_ACTIONS") == "true" and os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted"; root=Path(os.environ["SAYDRAFT_ASK_NATIVE_MODELS"]); assert root.parent.resolve() == Path(os.environ["RUNNER_TEMP"]).resolve() and not root.exists(); from saydraft.models.command import command_bundle,download_command_model; print(json.dumps({"explicit_developer_setup":True,"models":[{"id":m["id"],"license":m["license"]} for m in command_bundle("cpu")]})); download_command_model("cpu",models_dir=root)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAYDRAFT_ASK_NATIVE_MODELS=$askNativeCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify native read-only article through Ask and independent Notes
        shell: pwsh
        run: node tools/probe_ask_browser.mjs "$env:pythonLocation/python.exe" "$env:RUNNER_TEMP/saydraft-ask-browser"
      - name: Retain owned browser and native UIA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readonly-browser-ask-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/saydraft-ask-browser

  firewall-owned-rule-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install isolated probe dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify owned rule, native boundary, worker and download recovery
        shell: pwsh
        run: python -m tools.probe_firewall --output "$env:RUNNER_TEMP/saydraft-firewall-probe"
      - name: Retain disposable rule receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-firewall-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/saydraft-firewall-probe/report.json
            ${{ runner.temp }}/saydraft-firewall-probe/child-*/result.json
            ${{ runner.temp }}/saydraft-firewall-probe/child-*/process.json
            ${{ runner.temp }}/saydraft-firewall-probe/worker/report.json
            ${{ runner.temp }}/saydraft-firewall-probe/worker/cases.jsonl
