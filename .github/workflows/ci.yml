name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Fetch pinned VAD fixture for native offline smoke
        shell: pwsh
        run: |
          python -c "from saydraft.model_download import download_silero_vad_model; download_silero_vad_model(models_dir='build/test-models')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vadFixture = (Resolve-Path -LiteralPath 'build/test-models/vad/silero-vad-v5/silero_vad.onnx').Path
          "SAYDRAFT_TEST_SILERO_MODEL=$vadFixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Unit and offline tests
        run: python -m pytest tests -q
      - name: Cleanup regression evaluation
        run: python -m saydraft.eval --min-pass-rate 100 --min-cases 286
      - name: Adversarial cleanup validation
        run: python -m saydraft.cleanup.llm.eval_validation --min-catch-rate 100 --min-cases 100
