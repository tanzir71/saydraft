name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Fetch pinned VAD fixture for native offline smoke
        shell: pwsh
        run: |
          $vadFixture = python -c "from saydraft.model_download import download_silero_vad_model; print((download_silero_vad_model(models_dir='build/test-models') / 'silero_vad.onnx').resolve())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAYDRAFT_TEST_SILERO_MODEL=$vadFixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Unit and offline tests
        run: python -m pytest tests -q -rs --basetemp=build/pytest
      - name: Retain owned-window native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-window-native-diagnostics
          if-no-files-found: ignore
          path: |
            build/pytest/**/own-controls/report.json
            build/pytest/**/own-app-context/report.json
            build/pytest/**/own-tracked-edit/report.json
      - name: Cleanup regression evaluation
        run: python -m saydraft.eval --min-pass-rate 100 --min-cases 556
      - name: Adversarial cleanup validation
        run: python -m saydraft.cleanup.llm.eval_validation --min-catch-rate 100 --min-cases 100

  update-metadata-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify default-off policy without an outbound request
        run: python -m tools.probe_updates
      - name: Explicit opt-in public update metadata smoke
        run: python -m tools.probe_updates --enabled
